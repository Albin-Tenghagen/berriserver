name: Playwright Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  setup:
    name: Setup dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Cache API node_modules
      - name: Cache API dependencies
        uses: actions/cache@v3
        with:
          path: api/node_modules
          key: api-${{ hashFiles('api/package-lock.json') }}
          restore-keys: |
            api-

      - name: Install API dependencies
        working-directory: ./api
        run: npm install

      # Cache Web node_modules
      - name: Cache Web dependencies
        uses: actions/cache@v3
        with:
          path: web/node_modules
          key: web-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            web-

      - name: Install Web dependencies
        working-directory: ./web
        run: npm install

      # Cache Playwright browsers
      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            pw-

      - name: Install Playwright Browsers
        working-directory: ./web
        run: npx playwright install --with-deps

  test:
    name: Run Playwright Tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      # Restore API cache
      - name: Restore API node_modules
        uses: actions/cache@v3
        with:
          path: api/node_modules
          key: api-${{ hashFiles('api/package-lock.json') }}
          restore-keys: |
            api-

      # Restore Web cache
      - name: Restore Web node_modules
        uses: actions/cache@v3
        with:
          path: web/node_modules
          key: web-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            web-

      # Restore Playwright browsers cache
      - name: Restore Playwright browsers cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            pw-

      # Start API server
      - name: Start API server
        working-directory: ./api
        run: npm run dev &

      - name: Wait for API
        run: |
          until nc -z localhost 1337; do
            echo "Waiting for API..."
            sleep 1
          done

      # Start Web server
      - name: Start Web server
        working-directory: ./web
        run: npm run dev &

      - name: Wait for Web
        run: |
          until nc -z localhost 3000; do
            echo "Waiting for Web..."
            sleep 1
          done

      # Run Playwright tests
      - name: Run Playwright tests
        working-directory: ./web
        run: npx playwright test

      # Upload report
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 30
