name: Playwright Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: write
  pages: write

jobs:
  setup:
    name: Install & Cache Dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Cache API dependencies
      - name: Cache API node_modules
        uses: actions/cache@v3
        id: api-cache
        with:
          path: api/node_modules
          key: api-${{ hashFiles('api/package-lock.json') }}

      - name: Install API deps
        if: steps.api-cache.outputs.cache-hit != 'true'
        working-directory: ./api
        run: npm ci

      # Cache Web dependencies
      - name: Cache Web node_modules
        uses: actions/cache@v3
        id: web-cache
        with:
          path: web/node_modules
          key: web-${{ hashFiles('web/package-lock.json') }}

      - name: Install Web deps
        if: steps.web-cache.outputs.cache-hit != 'true'
        working-directory: ./web
        run: npm ci

      # Cache Playwright browsers (Chromium + Firefox)
      - name: Cache Playwright Browsers
        uses: actions/cache@v3
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ hashFiles('web/package-lock.json') }}
          restore-keys: pw-

      # Install only required browsers (chromium + firefox)
      - name: Install Playwright browsers
        working-directory: ./web
        run: npx playwright install chromium firefox --with-deps

  test:
    name: Run Playwright Tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Restore API cache
      - name: Restore API node_modules
        uses: actions/cache@v3
        with:
          path: api/node_modules
          key: api-${{ hashFiles('api/package-lock.json') }}
          restore-keys: api-

      # Restore Web cache
      - name: Restore Web node_modules
        uses: actions/cache@v3
        with:
          path: web/node_modules
          key: web-${{ hashFiles('web/package-lock.json') }}
          restore-keys: web-

      # Restore Playwright browser cache
      - name: Restore Playwright Browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ hashFiles('web/package-lock.json') }}
          restore-keys: pw-

      # Start API server
      - name: Start API server
        working-directory: ./api
        run: npm run dev &

      - name: Wait for API
        run: |
          until nc -z localhost 1337; do
            echo "Waiting for API..."
            sleep 1
          done

      # Start Web server
      - name: Start Web server
        working-directory: ./web
        run: npm run dev &

      - name: Wait for Web
        run: |
          until nc -z localhost 5173; do
            echo "Waiting for Web..."
            sleep 1
          done

      # Run Playwright tests
      - name: Run Playwright Tests
        working-directory: ./web
        run: npx playwright test --project=${{ matrix.browser }}
        continue-on-error: true

      # Upload Playwright report
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 30

  pages:
    name: Publish Report to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: ./web/playwright-report/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/playwright-report/
          publish_branch: gh-pages
          force_orphan: true
