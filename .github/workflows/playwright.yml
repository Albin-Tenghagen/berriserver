name: Playwright Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: write
  pages: write

jobs:
  setup:
    name: Install & Cache Dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Cache API dependencies
      - name: Cache API node_modules
        uses: actions/cache@v3
        id: api-cache
        with:
          path: api/node_modules
          key: api-${{ hashFiles('api/package-lock.json') }}

      - name: Install API deps
        if: steps.api-cache.outputs.cache-hit != 'true'
        working-directory: ./api
        run: npm ci

      # Cache Web dependencies
      - name: Cache Web node_modules
        uses: actions/cache@v3
        id: web-cache
        with:
          path: web/node_modules
          key: web-${{ hashFiles('web/package-lock.json') }}

      - name: Install Web deps
        if: steps.web-cache.outputs.cache-hit != 'true'
        working-directory: ./web
        run: npm ci

      # Use official Playwright cache
      - uses: microsoft/playwright-github-action@v1

      # Save workspace as artifact so test job doesn't reinstall
      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: |
            api/
            web/

  test:
    name: Run Playwright Tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - uses: actions/checkout@v4

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace
          path: ./

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Start API server
      - name: Start API server
        working-directory: ./api
        run: npm run dev &

      - name: Wait for API
        run: npx wait-on http://localhost:1337 --timeout 60000

      # Start Web server
      - name: Start Web server
        working-directory: ./web
        run: npm run dev &

      - name: Wait for Web
        run: npx wait-on http://localhost:5173 --timeout 60000

      # Run Playwright Test for each browser
      - name: Run Playwright Tests
        working-directory: ./web
        run: npx playwright test --project=${{ matrix.browser }}
        continue-on-error: true

      # Upload report always
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 30

  pages:
    name: Publish Report to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: ./web/playwright-report/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/playwright-report/
          publish_branch: gh-pages
          force_orphan: true
